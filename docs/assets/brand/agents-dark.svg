<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-label="Supported AI coding agents">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F095C8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F095C8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F095C8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241822"/>
      <stop offset="100%" stop-color="#1A1218"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
